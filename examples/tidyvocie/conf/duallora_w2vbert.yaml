# -------------------------------------------------------------------
# 实验设置
# -------------------------------------------------------------------
exp_dir: exp/tidy_w2vbert_dual_lora_s1
gpus: "[0,1,2,3,4,5,6,7]"
num_avg: 1
enable_amp: True
seed: 42

# LoRA 训练通常收敛较快，但因为有对抗任务，可以适当多给几轮
num_epochs: 3
save_epoch_interval: 1
log_batch_interval: 100

# -------------------------------------------------------------------
# 损失权重 (executor.py 需要读取)
# -------------------------------------------------------------------
loss_weights:
  spk: 1.0
  lang: 0.0   # 辅助任务权重
  orth: 0.0   # 正交约束权重
  adv: 0.0    # 对抗损失权重 (建议前几个epoch在 executor 里设为 0，后面再开启)

# -------------------------------------------------------------------
# 数据加载
# -------------------------------------------------------------------
dataloader_args:
  batch_size: 64          # LoRA 省显存，可以适当加大 batch size
  num_workers: 8
  pin_memory: False
  prefetch_factor: 4
  drop_last: True

# -------------------------------------------------------------------
# 数据集参数
# -------------------------------------------------------------------
dataset_args:
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 200    # 2秒
    max_num_frames: 700    # 4秒
  resample_rate: 16000
  cmvn: False

  speed_perturb: False     # LoRA 微调通常不开变速，尤其是做解耦时
  num_frms: 600            # 3秒切片
  aug_prob: 0.3

  frontend: "w2vbert"
  w2vbert_args:
    model_name: "/data0/sgqt7/PTMs/w2v-bert-2.0"
    frozen: True           # 【关键】彻底冻结 Frontend
    use_lora: False        # 【关键】关闭自带 LoRA，使用我们自定义的 Backend LoRA
    lora_config_args: null

# -------------------------------------------------------------------
# 模型定义 (核心修改)
# -------------------------------------------------------------------
model: DualLoRA_W2VBert    # 对应 dual_lora_w2vbert_adapter_mfa.py 里的接口函数
model_init: null           # 设为 null，由 train.py 手动加载
model_args:
  feat_dim: 1024
  embed_dim: 256
  pooling_func: "ASP"
  n_mfa_layers: -1         # 【关键】设为 -1，自动匹配 ckpt 的 25 层
  adapter_dim: 128
  dropout: 0.0
  num_frontend_hidden_layers: 24

  # Dual LoRA 参数
  spk_rank: 32
  lang_rank: 16
  spk_layer_start: 1      # Spk LoRA: 12-24 层
  spk_layer_end: 24
  lang_layer_start: 1      # Lang LoRA: 6-18 层
  lang_layer_end: 24

# -------------------------------------------------------------------
# 损失与 Margin (保持不变，Sub-Center 适合多语言/多模态)
# -------------------------------------------------------------------
projection_args:
  project_type: arc_margin_intertopk_subcenter
  scale: 32.0
  easy_margin: false
  K: 3
  mp: 0.06
  k_top: 5
  do_lm: true

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.2
  final_margin: 0.3
  increase_start_epoch: 0
  fix_start_epoch: 2
  update_margin: true
  increase_type: linear

loss: CrossEntropyLoss
loss_args: {}

# -------------------------------------------------------------------
# 优化器
# -------------------------------------------------------------------
optimizer: AdamW
optimizer_args:
  # LoRA 只训练少量参数，LR 可以比全量微调(1e-5) 大 10-100 倍
  lr: 0.0001
  weight_decay: 0.0001

# -------------------------------------------------------------------
# 调度器
# -------------------------------------------------------------------
scheduler: WarmupCosineScheduler
scheduler_args:
  min_lr: 0.00001
  max_lr: 0.0001            # 保持与 optimizer lr 一致
  warmup_epoch: 1
  fix_epoch: 2